name: Build DraculaWeb GeckoView + Chrome Compatibility Layer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create DraculaWeb GeckoView project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/tushar/browser app/src/main/res/values
          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'DraculaWeb'
          include ':app'
          GRADLE
          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.6.1' apply false }
          GRADLE
          cat > gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.tushar.browser'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.tushar.browser'
                  minSdk 23
                  targetSdk 28
                  versionCode 6
                  versionName '2.6-geckoview'
              }
          }
          dependencies {
              implementation 'org.mozilla.geckoview:geckoview:160.0.20261009095038'
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application android:label="DraculaWeb" android:theme="@android:style/Theme.Material.NoActionBar" android:usesCleartextTraffic="true" android:hardwareAccelerated="true">
                  <activity android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden|locale|layoutDirection" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/src/main/java/com/tushar/browser/ChromeCompat.java <<'JAVA'
          package com.tushar.browser;

          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;

          /** First-stage compatibility layer: analyzes a Chrome manifest and reports what needs adapting.
           * It deliberately does not claim to convert or run unsupported Chrome APIs. */
          public final class ChromeCompat {
              private ChromeCompat() {}
              public static final class Report {
                  public final String name, manifestVersion;
                  public final int score;
                  public final List<String> supported = new ArrayList<>(), partial = new ArrayList<>(), unsupported = new ArrayList<>(), notes = new ArrayList<>();
                  Report(String n, String mv) { name=n; manifestVersion=mv; score=0; }
                  public String format() {
                      StringBuilder b=new StringBuilder();
                      b.append("Extension: ").append(name).append("\nManifest: ").append(manifestVersion).append("\n\n");
                      section(b,"Likely adaptable",supported); section(b,"Needs adapter / testing",partial); section(b,"Likely incompatible",unsupported); section(b,"Notes",notes);
                      b.append("\nImportant: this is a static manifest check, not a guarantee that the extension will run.");
                      return b.toString();
                  }
                  private static void section(StringBuilder b,String title,List<String> list){b.append(title).append(" (").append(list.size()).append("):\n"); if(list.isEmpty())b.append(" • None detected\n"); else for(String s:list)b.append(" • ").append(s).append("\n");b.append("\n");}
              }
              public static Report analyze(String raw) throws Exception {
                  JSONObject m=new JSONObject(raw);
                  String name=m.optString("name","Unnamed extension");
                  String mv=m.has("manifest_version")?String.valueOf(m.optInt("manifest_version",0)):"unknown";
                  Report r=new Report(name,mv);
                  if(!"2".equals(mv) && !"3".equals(mv))r.unsupported.add("Unknown manifest_version");
                  JSONArray perms=m.optJSONArray("permissions");
                  if(perms!=null) for(int i=0;i<perms.length();i++){
                      String x=perms.optString(i);
                      if(x.equals("storage"))r.supported.add("permission: storage (basic storage API can be bridged)");
                      else if(x.equals("tabs")||x.equals("activeTab")||x.equals("scripting")||x.equals("contextMenus")||x.equals("notifications"))r.partial.add("permission: "+x+" (API behavior differs; adapter needed)");
                      else if(x.equals("webRequest")||x.equals("webRequestBlocking")||x.equals("declarativeNetRequest")||x.equals("nativeMessaging")||x.equals("debugger"))r.unsupported.add("permission: "+x+" (not safely portable in this layer)");
                      else r.partial.add("permission: "+x+" (not yet mapped)");
                  }
                  JSONObject bg=m.optJSONObject("background");
                  if(bg!=null){ if(bg.has("service_worker"))r.unsupported.add("Manifest V3 background service_worker needs a compatible background runtime"); if(bg.has("scripts"))r.partial.add("Manifest V2 background scripts need Gecko-specific packaging and testing"); }
                  if(m.has("content_scripts"))r.partial.add("content_scripts: verify match patterns, injection timing, and permissions");
                  if(m.has("declarative_net_request"))r.unsupported.add("declarative_net_request rules are not converted by this analyzer");
                  if(m.has("chrome_url_overrides"))r.unsupported.add("chrome_url_overrides uses Chrome-only browser pages");
                  if(m.has("side_panel"))r.unsupported.add("side_panel is Chrome-specific UI");
                  if(m.has("action")||m.has("browser_action")||m.has("page_action"))r.partial.add("toolbar action UI requires a GeckoView extension-action integration");
                  if(m.has("host_permissions"))r.partial.add("host_permissions: check Gecko permission model and user consent");
                  if("3".equals(mv))r.notes.add("Manifest V3 detected. Service workers and declarativeNetRequest are not automatically converted.");
                  r.notes.add("GeckoView accepts Mozilla-signed WebExtensions; a Chrome .crx is not directly installable.");
                  if(r.supported.isEmpty()&&r.partial.isEmpty()&&r.unsupported.isEmpty())r.notes.add("No common APIs were identified from the manifest alone.");
                  return r;
              }
          }
          JAVA
          cat > app/src/main/java/com/tushar/browser/MainActivity.java <<'JAVA'
          package com.tushar.browser;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.mozilla.geckoview.GeckoRuntime;
          import org.mozilla.geckoview.GeckoSession;
          import org.mozilla.geckoview.GeckoView;
          import org.mozilla.geckoview.WebExtension;
          import org.mozilla.geckoview.WebExtensionController;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends Activity {
              private final int bg = Color.rgb(12, 17, 25), panel = Color.rgb(25, 35, 45), text = Color.rgb(240, 246, 250), accent = Color.rgb(77, 218, 196);
              private LinearLayout root, tabsRow;
              private EditText urlBar;
              private FrameLayout pageFrame;
              private final ArrayList<GeckoSession> sessions = new ArrayList<>();
              private final ArrayList<GeckoView> views = new ArrayList<>();
              private int current = -1;
              private GeckoRuntime runtime;
              private WebExtensionController extensionController;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  runtime = GeckoRuntime.create(this);
                  extensionController = runtime.getWebExtensionController();
                  buildUi();
                  newTab("https://www.google.com");
              }
              private int dp(float n) { return (int)(n * getResources().getDisplayMetrics().density + .5f); }
              private android.graphics.drawable.GradientDrawable shape(int color, int stroke) {
                  android.graphics.drawable.GradientDrawable d = new android.graphics.drawable.GradientDrawable();
                  d.setColor(color); d.setCornerRadius(dp(12)); d.setStroke(dp(1), stroke); return d;
              }
              private Button button(String label) {
                  Button b = new Button(this); b.setText(label); b.setTextColor(text); b.setTextSize(12); b.setAllCaps(false);
                  b.setPadding(dp(8), 0, dp(8), 0); b.setBackground(shape(panel, Color.rgb(53, 72, 83)));
                  if (android.os.Build.VERSION.SDK_INT >= 21) b.setStateListAnimator(null); return b;
              }
              private void buildUi() {
                  root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(dp(5),dp(5),dp(5),dp(4)); root.setBackgroundColor(bg);
                  LinearLayout bar = new LinearLayout(this); bar.setGravity(Gravity.CENTER_VERTICAL);
                  TextView brand = new TextView(this); brand.setText("🧛 DraculaWeb"); brand.setTextColor(accent); brand.setTextSize(14); brand.setTypeface(android.graphics.Typeface.DEFAULT_BOLD); brand.setSingleLine(true);
                  bar.addView(brand, new LinearLayout.LayoutParams(-2,dp(42)));
                  urlBar = new EditText(this); urlBar.setSingleLine(true); urlBar.setTextSize(13); urlBar.setTextColor(text); urlBar.setHintTextColor(Color.GRAY); urlBar.setHint("Search or URL"); urlBar.setPadding(dp(8),0,dp(5),0); urlBar.setBackground(shape(panel,Color.rgb(53,72,83))); urlBar.setImeOptions(EditorInfo.IME_ACTION_GO);
                  LinearLayout.LayoutParams urlLp = new LinearLayout.LayoutParams(0,dp(40),1); urlLp.leftMargin=dp(5); bar.addView(urlBar,urlLp);
                  urlBar.setOnEditorActionListener((v, action, event)-> { if(action==EditorInfo.IME_ACTION_GO || action==EditorInfo.IME_ACTION_DONE || (event!=null && event.getKeyCode()==android.view.KeyEvent.KEYCODE_ENTER)){ go(); return true;} return false; });
                  Button plus=button("＋"); plus.setTextSize(20); LinearLayout.LayoutParams pLp=new LinearLayout.LayoutParams(dp(38),dp(40)); pLp.leftMargin=dp(4); bar.addView(plus,pLp); plus.setOnClickListener(v->newTab("https://www.google.com"));
                  Button menu=button("⋮"); menu.setTextSize(22); LinearLayout.LayoutParams mLp=new LinearLayout.LayoutParams(dp(34),dp(40)); mLp.leftMargin=dp(3); bar.addView(menu,mLp); menu.setOnClickListener(v->menu());
                  root.addView(bar);
                  HorizontalScrollView tabScroll=new HorizontalScrollView(this); tabScroll.setHorizontalScrollBarEnabled(false); tabsRow=new LinearLayout(this); tabScroll.addView(tabsRow); root.addView(tabScroll);
                  pageFrame=new FrameLayout(this); LinearLayout.LayoutParams frameLp=new LinearLayout.LayoutParams(-1,0,1); frameLp.topMargin=dp(4); root.addView(pageFrame,frameLp);
                  LinearLayout bottom=new LinearLayout(this); Button cookies=button("Clear Cookies"), cache=button("Clear Cache"); bottom.addView(cookies,new LinearLayout.LayoutParams(0,dp(34),1)); bottom.addView(cache,new LinearLayout.LayoutParams(0,dp(34),1)); cookies.setOnClickListener(v->clearCookies()); cache.setOnClickListener(v->clearCache()); root.addView(bottom);
                  setContentView(root);
              }
              private void go(){ String s=urlBar.getText().toString().trim(); if(s.isEmpty())return; String target; if(s.matches("(?i)^https?://.*")) target=s; else if(s.matches("(?i)^[a-z0-9.-]+\\.[a-z]{2,}(:[0-9]+)?(/.*)?$")) target="https://"+s; else target="https://www.google.com/search?q="+Uri.encode(s); if(current<0)newTab(target);else sessions.get(current).loadUri(target); }
              private void newTab(String url){ GeckoSession s=new GeckoSession(); s.open(runtime); GeckoView v=new GeckoView(this); v.setSession(s); s.setNavigationDelegate(new GeckoSession.NavigationDelegate(){ @Override public void onLocationChange(GeckoSession session, String location, List<GeckoSession.PermissionDelegate.ContentPermission> perms, Boolean hasUserGesture){ runOnUiThread(()->{int i=sessions.indexOf(session); if(i==current)urlBar.setText(location==null?"":location); refreshTabs();}); }}); sessions.add(s); views.add(v); pageFrame.addView(v,new FrameLayout.LayoutParams(-1,-1)); current=sessions.size()-1; for(int i=0;i<views.size();i++)views.get(i).setVisibility(i==current?View.VISIBLE:View.GONE); if(url!=null)s.loadUri(url); refreshTabs(); }
              private void refreshTabs(){ if(tabsRow==null)return; tabsRow.removeAllViews(); for(int i=0;i<sessions.size();i++){ final int ix=i; LinearLayout chip=new LinearLayout(this); chip.setGravity(Gravity.CENTER_VERTICAL); chip.setBackground(shape(i==current?Color.rgb(23,56,62):panel,i==current?accent:Color.rgb(53,72,83))); Button select=button("Tab "+(i+1)); select.setBackgroundColor(Color.TRANSPARENT); chip.addView(select,new LinearLayout.LayoutParams(-2,dp(34))); select.setOnClickListener(v->{current=ix; for(int j=0;j<views.size();j++)views.get(j).setVisibility(j==current?View.VISIBLE:View.GONE); refreshTabs(); String u=sessions.get(current).getCurrentUrl();urlBar.setText(u==null?"":u);}); Button close=button("×"); close.setTextSize(18); chip.addView(close,new LinearLayout.LayoutParams(dp(30),dp(34))); close.setOnClickListener(v->closeTab(ix)); LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-2,dp(36));lp.rightMargin=dp(5);tabsRow.addView(chip,lp); } }
              private void closeTab(int i){ if(sessions.size()<=1){Toast.makeText(this,"Keep at least one tab open",Toast.LENGTH_SHORT).show();return;} GeckoSession s=sessions.remove(i); GeckoView v=views.remove(i); pageFrame.removeView(v); s.close(); if(i<current)current--; else if(i==current)current=Math.min(i,sessions.size()-1); for(int j=0;j<views.size();j++)views.get(j).setVisibility(j==current?View.VISIBLE:View.GONE); String u=sessions.get(current).getCurrentUrl();urlBar.setText(u==null?"":u);refreshTabs(); }
              private void menu(){ String[] items={"🔖 Bookmarks (coming soon)","🕘 History (coming soon)","📥 Downloads (coming soon)","🧩 Extensions manager","🌐 Open Chrome Web Store","🦊 Open Firefox Add-ons","↻ Reload","↗ Share page","🖥 Desktop site (coming soon)","⚙ Settings (coming soon)"}; new AlertDialog.Builder(this).setTitle("🧛 DraculaWeb").setItems(items,(d,w)->{switch(w){case 0:case 1:case 2:case 8:case 9:Toast.makeText(this,"This feature is not implemented in this GeckoView prototype yet",Toast.LENGTH_LONG).show();break;case 3:extensionsMenu();break;case 4:sessions.get(current).loadUri("https://chromewebstore.google.com/");break;case 5:sessions.get(current).loadUri("https://addons.mozilla.org/android/");break;case 6:sessions.get(current).reload();break;case 7:share();break;}}).show(); }
              private void extensionsMenu(){ String[] items={"Analyze Chrome manifest (compatibility)","Install signed .xpi by URL","List installed extensions","Uninstall an extension"}; new AlertDialog.Builder(this).setTitle("WebExtensions / Compatibility").setItems(items,(d,w)->{if(w==0)analyzeChromeManifest();else if(w==1)installExtensionDialog();else listExtensions(w==3);}).show(); }
              private void analyzeChromeManifest(){
                  EditText input=new EditText(this); input.setMinLines(6); input.setGravity(Gravity.TOP|Gravity.START); input.setHint("Paste extension manifest.json here");
                  new AlertDialog.Builder(this).setTitle("Chrome Extension Compatibility Analyzer").setMessage("Open the extension's manifest.json and paste its contents below. This reports likely compatibility; it does not automatically convert or install the extension.").setView(input).setNegativeButton("Cancel",null).setPositiveButton("Analyze",(d,w)->{try{ChromeCompat.Report report=ChromeCompat.analyze(input.getText().toString()); new AlertDialog.Builder(this).setTitle("Compatibility report").setMessage(report.format()).setPositiveButton("OK",null).show();}catch(Exception e){new AlertDialog.Builder(this).setTitle("Invalid manifest.json").setMessage("Could not read JSON: "+e.getMessage()).setPositiveButton("OK",null).show();}}).show();
              }
              private void installExtensionDialog(){ EditText input=new EditText(this);input.setSingleLine(true);input.setHint("https://.../addon.xpi"); new AlertDialog.Builder(this).setTitle("Install Firefox WebExtension").setMessage("Enter a direct HTTPS URL to a Mozilla-signed .xpi package. Chrome Web Store extensions are not directly installable.").setView(input).setNegativeButton("Cancel",null).setPositiveButton("Install",(d,w)->{String uri=input.getText().toString().trim();if(!uri.startsWith("https://")){Toast.makeText(this,"Use a direct HTTPS .xpi URL",Toast.LENGTH_LONG).show();return;} extensionController.install(uri,WebExtensionController.INSTALLATION_METHOD_MANAGER).accept(ext->runOnUiThread(()->Toast.makeText(this,"Installed: "+ext.metaData.name,Toast.LENGTH_LONG).show()),err->runOnUiThread(()->new AlertDialog.Builder(this).setTitle("Extension install failed").setMessage(err.getMessage()==null?err.toString():err.getMessage()).setPositiveButton("OK",null).show()));}).show(); }
              private void listExtensions(boolean uninstall){ extensionController.list().accept(list->runOnUiThread(()->{if(list==null||list.isEmpty()){Toast.makeText(this,"No extensions installed",Toast.LENGTH_SHORT).show();return;} String[] names=new String[list.size()];for(int i=0;i<list.size();i++)names[i]=list.get(i).metaData.name+" — "+list.get(i).id;new AlertDialog.Builder(this).setTitle(uninstall?"Choose extension to uninstall":"Installed extensions").setItems(names,(d,which)->{if(uninstall)extensionController.uninstall(list.get(which)).accept(v->runOnUiThread(()->Toast.makeText(this,"Extension uninstalled",Toast.LENGTH_SHORT).show()),e->runOnUiThread(()->Toast.makeText(this,"Uninstall failed: "+e.getMessage(),Toast.LENGTH_LONG).show()));else new AlertDialog.Builder(this).setTitle(list.get(which).metaData.name).setMessage("ID: "+list.get(which).id+"\nVersion: "+list.get(which).metaData.version).setPositiveButton("OK",null).show();}).setNegativeButton("Close",null).show();}),err->runOnUiThread(()->Toast.makeText(this,"Cannot list extensions: "+err.getMessage(),Toast.LENGTH_LONG).show())); }
              private void share(){String u=sessions.get(current).getCurrentUrl();if(u==null)return;Intent i=new Intent(Intent.ACTION_SEND);i.setType("text/plain");i.putExtra(Intent.EXTRA_TEXT,u);startActivity(Intent.createChooser(i,"Share page"));}
              private void clearCookies(){ new AlertDialog.Builder(this).setTitle("Clear cookies?").setMessage("This clears GeckoView browsing data for this browser profile, which may sign you out of websites.").setNegativeButton("Cancel",null).setPositiveButton("Clear",(d,w)->{runtime.getStorageController().clearData(org.mozilla.geckoview.StorageController.ClearFlags.COOKIES | org.mozilla.geckoview.StorageController.ClearFlags.DOM_STORAGES | org.mozilla.geckoview.StorageController.ClearFlags.AUTH_SESSIONS).accept(v->runOnUiThread(()->{if(current>=0)sessions.get(current).reload();Toast.makeText(this,"Cookies/site data cleared; page reloaded",Toast.LENGTH_LONG).show();}),e->runOnUiThread(()->Toast.makeText(this,"Clear failed: "+e.getMessage(),Toast.LENGTH_LONG).show()));}).show(); }
              private void clearCache(){ runtime.getStorageController().clearData(org.mozilla.geckoview.StorageController.ClearFlags.ALL_CACHES).accept(v->runOnUiThread(()->{if(current>=0)sessions.get(current).reload();Toast.makeText(this,"Cache cleared; page reloaded",Toast.LENGTH_SHORT).show();}),e->runOnUiThread(()->Toast.makeText(this,"Clear failed: "+e.getMessage(),Toast.LENGTH_LONG).show())); }
              @Override public void onBackPressed(){if(current>=0){GeckoSession s=sessions.get(current);s.getWebExtensionController(); s.getNavigationDelegate(); s.getHistoryDelegate(); /* use Gecko session navigation history */ s.goBack();}else super.onBackPressed();}
              @Override protected void onDestroy(){for(GeckoSession s:sessions){try{s.close();}catch(Exception ignored){}}super.onDestroy();}
          }
          JAVA
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DraculaWeb-GeckoView-CompatLayer-Prototype-APK
          path: app/build/outputs/apk/debug/app-debug.apk
